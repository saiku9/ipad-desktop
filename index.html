<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e5efff"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>iPad Desktop</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#20304b;background:radial-gradient(ellipse at 65% 70%,#80c8ff,transparent 35%),linear-gradient(135deg,#10265e,#326bce);height:100dvh;overflow:hidden}button,input,textarea{font:inherit}button{border:0;border-radius:7px;padding:9px;background:transparent;color:inherit;cursor:pointer}button:hover{background:#92b6df44}#icons{display:grid;gap:12px;width:100px;padding:15px;color:white}#icons button span{display:block;font-size:32px}#desk{position:absolute;inset:0 0 58px;overflow:hidden}footer{position:absolute;bottom:0;left:0;right:0;height:58px;background:#e5efffee;display:flex;align-items:center;justify-content:center;gap:5px;z-index:9999;padding-bottom:env(safe-area-inset-bottom)}footer button{font-size:22px}#clock{position:absolute;right:12px;font-size:11px;text-align:right}#menu{position:absolute;bottom:68px;left:50%;transform:translateX(-50%);width:min(400px,94vw);background:#edf4ff;color:#20304b;padding:20px;border-radius:14px;box-shadow:0 12px 40px #0005;z-index:9998}#menu input{width:100%;padding:10px;border:1px solid #aabbd0;border-radius:8px}#pins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}#pins span{display:block;font-size:30px}.win{position:absolute;background:#f8faff;color:#20304b;border:1px solid #aabbd0;border-radius:10px;box-shadow:0 10px 30px #0005;width:min(540px,90%);height:min(370px,85%);overflow:hidden;display:flex;flex-direction:column}.bar{display:flex;align-items:center;background:#e1eaf8;touch-action:none;cursor:move;padding-left:12px;min-height:42px}.bar b{flex:1}.content{flex:1;overflow:auto;padding:15px}.content textarea{width:100%;height:90%;background:transparent;color:inherit;border:0;resize:none;outline:none}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.keys button{background:#aabbd044}.display{font-size:28px;text-align:right;padding:10px;overflow-wrap:anywhere}.dark .win,.dark #menu{background:#202838;color:#e8efff}.dark .bar,.dark footer{background:#303b50;color:#fff}.grip{position:absolute;bottom:0;right:0;width:24px;height:24px;touch-action:none;cursor:nwse-resize;background:linear-gradient(135deg,transparent 65%,#8295b8 66%,transparent 72%,#8295b8 73%,transparent 80%)}[hidden]{display:none!important}@media(max-width:500px){#clock{display:none}}

footer,#menu,.bar{backdrop-filter:blur(24px)}footer{background:#e5efffce}.win{animation:appear .16s ease-out}@keyframes appear{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}.content input:not([type=file]),.content textarea{border:1px solid #aabbd0;border-radius:7px;padding:8px;background:transparent;color:inherit;max-width:100%}.content button{background:#93b6df35;margin:3px}.content p{overflow-wrap:anywhere}.tools{display:flex;flex-wrap:wrap;gap:3px}.entry{display:flex;align-items:center;gap:5px;border-bottom:1px solid #aabbd044}.entry button:first-child{flex:1;text-align:left;overflow-wrap:anywhere}#icons{max-height:100%;overflow:auto;grid-auto-flow:column;grid-template-rows:repeat(5, minmax(65px,1fr));width:max-content;max-width:100%}#icons button{width:86px}#pins{max-height:50dvh;overflow:auto}.popup{position:absolute;z-index:10001;background:#edf4ff;color:#20304b;border-radius:9px;padding:8px;box-shadow:0 8px 30px #0006;display:grid;min-width:145px}.dark .popup{background:#303b50;color:white}.popup button{text-align:left}.widget{position:absolute;right:18px;top:18px;color:white;background:#132d5a77;padding:15px;border-radius:16px;pointer-events:none;text-align:right}.content iframe{width:100%;height:65%;border:1px solid #aabbd0}.content textarea.short{height:120px}.content a{color:#2375cc}
</style><div id="desk"><div id="icons"></div></div><div id="menu" hidden><input id="search" placeholder="アプリを検索"><h3>ピン留め済み</h3><div id="pins"></div><hr>iPad Desktop · Ver.2.0</div><footer><button id="start" aria-label="スタート" style="color:#1676df">⊞</button><button id="find" aria-label="検索">⌕</button><span id="tasks"></span><div id="clock"></div></footer><script>
const $=id=>document.getElementById(id),desk=$('desk'),menu=$('menu'),apps={files:['📁','ファイル'],notes:['📝','メモ帳'],calc:['🧮','電卓'],time:['🕒','時計'],settings:['⚙️','設定'],browser:['🌐','ブラウザ'],widgets:['📅','ウィジェット'],pc:['💻','PC連携'],store:['🛍️','ストア'],todo:['✓','ToDo'],text:['📄','テキスト作成']};let z=10;const save=(k,v)=>{try{localStorage.setItem(k,v)}catch{}},load=k=>{try{return localStorage.getItem(k)||''}catch{return ''}};const installed=new Set(JSON.parse(load('installed')||'[]'));const visible=()=>Object.entries(apps).filter(([k])=>!['todo','text'].includes(k)||installed.has(k));function buttons(){return visible().map(([k,a])=>`<button data-app="${k}"><span>${a[0]}</span>${a[1]}</button>`).join('')}$('icons').innerHTML=$('pins').innerHTML=buttons();$('tasks').innerHTML=visible().filter(([k])=>['files','notes','browser','store'].includes(k)).map(([k,a])=>`<button data-app="${k}" aria-label="${a[1]}">${a[0]}</button>`).join('');$('start').onclick=()=>menu.hidden=!menu.hidden;$('find').onclick=()=>{menu.hidden=false;$('search').focus()};$('search').oninput=e=>{for(const b of $('pins').children)b.hidden=!b.textContent.includes(e.target.value)};document.addEventListener('click',e=>{const b=e.target.closest('[data-app]');if(b)openApp(b.dataset.app);else if(e.target===desk)menu.hidden=true});
function openApp(k){menu.hidden=true;let w=$('w-'+k);if(w){w.hidden=false;w.style.zIndex=++z;return}w=document.createElement('section');w.id='w-'+k;w.className='win';Object.assign(w.style,{left:Math.min(110,desk.clientWidth*.08)+'px',top:Math.min(50,desk.clientHeight*.08)+'px',zIndex:++z});w.innerHTML=`<div class="bar"><b>${apps[k].join(' ')}</b><button class="min">−</button><button class="max">□</button><button class="close">×</button></div><div class="content"></div><div class="grip"></div>`;desk.append(w);let c=w.querySelector('.content'),restore;w.onpointerdown=()=>w.style.zIndex=++z;w.querySelector('.close').onclick=()=>w.remove();w.querySelector('.min').onclick=()=>w.hidden=true;w.querySelector('.max').onclick=()=>{if(restore){Object.assign(w.style,restore);restore=null}else{restore={left:w.style.left,top:w.style.top,width:w.style.width,height:w.style.height};Object.assign(w.style,{left:'0',top:'0',width:'100%',height:'100%'})}};function drag(el,resize){el.onpointerdown=e=>{if(e.target.closest('button'))return;let x=e.clientX,y=e.clientY,l=w.offsetLeft,t=w.offsetTop,a=w.offsetWidth,b=w.offsetHeight;el.setPointerCapture(e.pointerId);el.onpointermove=ev=>{let dx=ev.clientX-x,dy=ev.clientY-y;if(resize){w.style.width=Math.min(desk.clientWidth-l,Math.max(200,a+dx))+'px';w.style.height=Math.min(desk.clientHeight-t,Math.max(140,b+dy))+'px'}else{w.style.left=Math.max(0,Math.min(desk.clientWidth-a,l+dx))+'px';w.style.top=Math.max(0,Math.min(desk.clientHeight-42,t+dy))+'px'}};el.onpointerup=el.onpointercancel=()=>el.onpointermove=null}}drag(w.querySelector('.bar'),false);drag(w.querySelector('.grip'),true);
addSnap(w); extra(k,c);
if(k==='notes'){c.innerHTML='<textarea placeholder="メモを入力"></textarea><small>この端末に自動保存</small>';let a=c.querySelector('textarea');a.value=load('note');a.oninput=()=>save('note',a.value)}
if(k==='files')fileApp(c);
if(k==='time'){c.innerHTML='<div class="display live"></div>';tick()}
if(k==='calc'){let n='0',a=null,o='',fresh=false;c.innerHTML='<div class="display">0</div><div class="keys">'+['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='].map(v=>`<button>${v}</button>`).join('')+'</div>';function run(){let b=Number(n);n=String(o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:o==='÷'?a/b:b);a=null}c.querySelector('.keys').onclick=e=>{if(e.target.tagName!=='BUTTON')return;let v=e.target.textContent;if(v==='C'){n='0';a=null;fresh=false}else if(v==='±')n=String(-Number(n));else if(v==='%')n=String(Number(n)/100);else if(v==='⌫')n=n.slice(0,-1)||'0';else if('÷×−+'.includes(v)){if(a!==null&&!fresh)run();a=Number(n);o=v;fresh=true}else if(v==='='){if(a!==null)run();fresh=true}else{if(fresh){n='0';fresh=false}if(v!=='.'||!n.includes('.'))n=(n==='0'&&v!=='.'?'':n)+v}c.querySelector('.display').textContent=n}}
if(k==='settings'){c.innerHTML='<h3>個人用設定</h3><button id="mode">ライト / ダーク切替</button><p>壁紙</p>';c.querySelector('#mode').onclick=()=>{document.body.classList.toggle('dark');save('dark',document.body.classList.contains('dark')?'1':'0')};for(let bg of ['linear-gradient(135deg,#10265e,#326bce,#80c8ff)','linear-gradient(135deg,#261345,#ad79dd)','linear-gradient(135deg,#073c43,#63c5a9)']){let b=document.createElement('button');b.style.cssText='width:30%;height:65px;background:'+bg;b.setAttribute('aria-label','壁紙変更');b.onclick=()=>{document.body.style.background=bg;save('wall',bg)};c.append(b)}}}

function popup(x,y,items){document.querySelector('.popup')?.remove();let m=document.createElement('div');m.className='popup';for(let [label,fn] of items){let b=document.createElement('button');b.textContent=label;b.onclick=()=>{m.remove();fn()};m.append(b)}document.body.append(m);m.style.left=Math.max(0,Math.min(x,innerWidth-m.offsetWidth))+'px';m.style.top=Math.max(0,Math.min(y,innerHeight-m.offsetHeight))+'px'}
function snap(w,x,y,a,b){Object.assign(w.style,{left:x+'%',top:y+'%',width:a+'%',height:b+'%'})}
function addSnap(w){let b=document.createElement('button');b.textContent='▥';b.title='スナップ配置';w.querySelector('.bar').insertBefore(b,w.querySelector('.min'));b.onclick=()=>{let r=b.getBoundingClientRect();popup(r.left,r.bottom,[['左半分',()=>snap(w,0,0,50,100)],['右半分',()=>snap(w,50,0,50,100)],['左上',()=>snap(w,0,0,50,50)],['右上',()=>snap(w,50,0,50,50)],['左下',()=>snap(w,0,50,50,50)],['右下',()=>snap(w,50,50,50,50)],['全画面',()=>snap(w,0,0,100,100)]])}}
function context(e){if(e.target.closest('.win'))return; e.preventDefault();popup(e.clientX,e.clientY,[['ファイルを開く',()=>openApp('files')],['新しいメモ',()=>openApp('notes')],['個人用設定',()=>openApp('settings')],['ウィジェット',()=>openApp('widgets')]])}desk.addEventListener('contextmenu',context);let hold;desk.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&!e.target.closest('.win,button'))hold=setTimeout(()=>context(e),650)});for(let ev of ['pointerup','pointermove','pointercancel'])desk.addEventListener(ev,()=>clearTimeout(hold));document.addEventListener('pointerdown',e=>{if(!e.target.closest('.popup'))document.querySelector('.popup')?.remove()});
const dbp=new Promise((resolve,reject)=>{let r=indexedDB.open('ipad-desktop-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('entries',{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});async function dbop(mode,fn){let db=await dbp;return new Promise((resolve,reject)=>{let t=db.transaction('entries',mode),r=fn(t.objectStore('entries'));t.oncomplete=()=>resolve(r.result);t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)})}const all=()=>dbop('readonly',s=>s.getAll()),put=e=>dbop('readwrite',s=>s.put(e)),del=id=>dbop('readwrite',s=>s.delete(id));function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),30000)}
function fileApp(c){let folder='root';c.innerHTML='<div class="tools"><button data-f="up">↑ 上へ</button><button data-f="new">＋ フォルダ</button><button data-f="import">読み込み</button><button data-f="text">新規テキスト</button></div><input type="file" multiple hidden><p class="path"></p><div class="entries"></div><small>アプリ内保存領域 · 大切なファイルは書き出してバックアップしてください。</small>';let input=c.querySelector('input'),list=c.querySelector('.entries');const safe=fn=>async(...a)=>{try{await fn(...a)}catch(e){alert('保存・操作エラー: '+e.message)}};async function render(){let rows=await all();c.querySelector('.path').textContent='ホーム / '+(rows.find(r=>r.id===folder)?.name||'');list.replaceChildren();for(let r of rows.filter(r=>r.parent===folder)){let line=document.createElement('div');line.className='entry';let b=document.createElement('button');b.textContent=(r.dir?'📁 ':'📄 ')+r.name;b.onclick=safe(async()=>{if(r.dir){folder=r.id;await render()}else download(r.blob,r.name)});let more=document.createElement('button');more.textContent='⋯';let actions=[['名前変更',safe(async()=>{let n=prompt('新しい名前',r.name);if(n?.trim()){r.name=n.trim();await put(r);await render()}})],['削除',safe(async()=>{if(!confirm(r.name+' を削除しますか？'))return;let ids=[r.id];for(let i=0;i<ids.length;i++)for(let child of rows.filter(x=>x.parent===ids[i]))ids.push(child.id);for(let id of ids.reverse())await del(id);await render()})]];if(!r.dir)actions.unshift(['書き出す',()=>download(r.blob,r.name)]);more.onclick=e=>popup(e.clientX,e.clientY,actions);line.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();popup(e.clientX,e.clientY,actions)};line.append(b,more);list.append(line)}}const add=(name,dir,blob)=>put({id:crypto.randomUUID(),parent:folder,name,dir,blob});c.querySelector('.tools').onclick=safe(async e=>{switch(e.target.dataset.f){case'up':folder=(await all()).find(r=>r.id===folder)?.parent||'root';break;case'new':{let n=prompt('フォルダ名');if(n?.trim())await add(n.trim(),true);break}case'import':input.click();return;case'text':{let n=prompt('ファイル名','メモ.txt');if(n){let t=prompt('内容','');if(t!==null)await add(n,false,new Blob([t],{type:'text/plain'}))}break}}await render()});input.onchange=safe(async()=>{for(let f of input.files)await add(f.name,false,f);input.value='';await render()});safe(render)()}
function todo(c){let items=JSON.parse(load('todo2')||'[]');c.innerHTML='<div class="tools"><input placeholder="新しいタスク"><button>追加</button></div><div class="items"></div>';let input=c.querySelector('input');function render(){let l=c.querySelector('.items');l.replaceChildren();items.forEach((t,i)=>{let p=document.createElement('p'),ch=document.createElement('input'),label=document.createElement('span'),b=document.createElement('button');ch.type='checkbox';ch.checked=t.done;label.textContent=t.text;b.textContent='削除';ch.onchange=()=>{t.done=ch.checked;save('todo2',JSON.stringify(items))};b.onclick=()=>{items.splice(i,1);persist()};p.append(ch,label,b);l.append(p)})}function persist(){save('todo2',JSON.stringify(items));render()}c.querySelector('button').onclick=()=>{if(input.value.trim()){items.push({text:input.value.trim(),done:false});input.value='';persist()}};render()}
function extra(k,c){if(k==='browser'){c.innerHTML='<div class="tools"><input placeholder="URL または検索語"><button>開く</button><button>埋め込み</button></div><p>通常はSafariで開きます。埋め込みを拒否するサイトもあります。</p><iframe title="Web preview" sandbox="allow-scripts allow-forms" hidden></iframe>';let input=c.querySelector('input'),frame=c.querySelector('iframe');function url(){let v=input.value.trim();if(!v)return null;try{let u=new URL(v.includes('://')?v:v.includes('.')?'https://'+v:'https://www.google.com/search?q='+encodeURIComponent(v));return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}}c.querySelectorAll('button')[0].onclick=()=>{let u=url();if(u)window.open(u,'_blank','noopener,noreferrer')};c.querySelectorAll('button')[1].onclick=()=>{let u=url();if(u?.startsWith('https:')){frame.hidden=false;frame.src=u}};input.onkeydown=e=>{if(e.key==='Enter')c.querySelector('button').click()}}
if(k==='widgets'){let d=new Date();c.innerHTML='<h2 class="live"></h2><h3>カレンダー</h3><div class="calendar"></div><h3>ToDo</h3><div class="todo"></div>';let cal=c.querySelector('.calendar');let first=new Date(d.getFullYear(),d.getMonth(),1),last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();cal.style.cssText='display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center';for(let n of ['日','月','火','水','木','金','土',...Array(first.getDay()).fill(''),...Array.from({length:last},(_,i)=>i+1)]){let a=document.createElement('span');a.textContent=n;if(n===d.getDate())a.style.background='#80baff66';cal.append(a)}todo(c.querySelector('.todo'));tick()}
if(k==='todo')todo(c);if(k==='text'){c.innerHTML='<input placeholder="ファイル名" value="document.txt"><textarea class="short" placeholder="テキスト"></textarea><button>書き出す</button>';c.querySelector('button').onclick=()=>download(new Blob([c.querySelector('textarea').value],{type:'text/plain'}),c.querySelector('input').value||'document.txt')}
if(k==='store'){c.innerHTML='<h3>内蔵アプリストア</h3><p>追加アプリは無料・オフライン対応。</p>';for(let key of ['todo','text']){let b=document.createElement('button');function label(){b.textContent=apps[key].join(' ')+' · '+(installed.has(key)?'削除':'追加')}label();b.onclick=()=>{if(installed.has(key)){installed.delete(key);$('w-'+key)?.remove()}else installed.add(key);save('installed',JSON.stringify([...installed]));$('icons').innerHTML=$('pins').innerHTML=buttons();label()};c.append(b)}}
if(k==='pc'){c.innerHTML='<h3>Windows ファイル共有</h3><p>PC側の補助ソフトを起動し、表示されたURLを入力してください。同じ信頼できるWi-Fiが必要です。</p><input placeholder="http://192.168.x.x:8765/"><button>PCの共有ページを開く</button><p>Safariの別画面でファイルを送受信します。PCの遠隔操作は未対応です。</p>';c.querySelector('input').value=load('pcurl');c.querySelector('button').onclick=()=>{try{let u=new URL(c.querySelector('input').value);if(!['http:','https:'].includes(u.protocol))throw Error();save('pcurl',u.href);window.open(u.href,'_blank','noopener,noreferrer')}catch{alert('PCに表示されたURLを入力してください')}}}}
let widget=document.createElement('div');widget.className='widget';widget.innerHTML='<div class="live"></div><small>iPad Desktop 2.0</small>';desk.prepend(widget);
function tick(){let d=new Date();$('clock').innerHTML=d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+'<br>'+d.toLocaleDateString('ja-JP');document.querySelectorAll('.live').forEach(x=>x.textContent=d.toLocaleString('ja-JP'))}tick();setInterval(tick,1000);if(load('dark')==='1')document.body.classList.add('dark');if(load('wall'))document.body.style.background=load('wall');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
